name: Link Check

on:
  pull_request:
    paths: ["**/*.md"]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--no-progress --verbose --exclude-path 'TEMPLATE\\.md' './**/*.md'"
          fail: true
