name: Markdown Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  markdownlint:
    name: Lint Markdown files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: articulate/run-markdownlint-action@v1
        with:
          config: .markdownlint.json
          ignore: "**/TEMPLATE.md"
